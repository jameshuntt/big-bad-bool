# Tests every push and pull request on the newest Rust and on the oldest one
# these crates support (rust-version in Cargo.toml), and runs clippy. On main, once the
# tests pass, publishes each crate whose Cargo.toml version is not on crates.io yet,
# in dependency order. Publishing uses crates.io trusted publishing: no stored token.
#
# The two Rust versions check different feature sets. The facade's `program-bowl` feature pulls in
# ob-serve-a-bowl, which needs Rust 1.88, so the oldest Rust checks the default features and `program`
# (big_bad_bool::program without Bowl), and the newest checks every feature.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # the crates this repo publishes, in the order they depend on each other
  CRATES: big-bad-bool-core big-bad-bool-derive big-bad-bool big-bad-bool-interact big-bad-bool-test-suite

jobs:
  test:
    name: test on Rust ${{ matrix.rust }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rust: stable
            workspace: --all-features
            facade: program-bowl
            docs: --all-features
          - rust: "1.85"
            workspace: ""
            facade: program
            docs: --features big-bad-bool/program
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - name: Dependency versions the oldest supported Rust can build
        # the runner's newest cargo writes a fresh Cargo.lock, picking for each dependency the newest version
        # whose rust-version this one meets
        if: matrix.rust != 'stable'
        run: CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS=fallback cargo +stable generate-lockfile
      - name: Test
        run: cargo test --workspace ${{ matrix.workspace }}
      - name: Test the facade with ${{ matrix.facade }}
        run: cargo test --manifest-path crates/big-bad-bool/Cargo.toml --features ${{ matrix.facade }}
      - name: Docs, warnings denied
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps ${{ matrix.docs }}

  clippy:
    name: clippy on Rust ${{ matrix.rust }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rust: stable
            facade: program-bowl
            targets: --all-targets
          # clippy 1.85 reports unnecessary_cast inside #[bitpack] expansions, so the facade's tests are
          # linted on stable only
          - rust: "1.85"
            facade: program
            targets: --lib
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy
      - name: Dependency versions the oldest supported Rust can build
        if: matrix.rust != 'stable'
        run: CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS=fallback cargo +stable generate-lockfile
      - name: Clippy
        if: matrix.rust == 'stable'
        run: cargo clippy --workspace --all-targets --all-features
      - name: Clippy on the facade with ${{ matrix.facade }}, warnings denied
        run: cargo clippy --manifest-path crates/big-bad-bool/Cargo.toml --no-deps ${{ matrix.targets }} --features ${{ matrix.facade }} -- -D warnings

  publish:
    needs: [test, clippy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Which crates are not on crates.io at this version?
        id: check
        run: |
          new=""
          for name in $CRATES; do
            version=$(cargo metadata --no-deps --format-version 1 | jq -r --arg n "$name" '.packages[] | select(.name == $n) | .version')
            status=$(curl -s -o /dev/null -w '%{http_code}' -A "github.com/${GITHUB_REPOSITORY} CI" "https://crates.io/api/v1/crates/$name/$version")
            case "$status" in
              200) echo "$name $version is already on crates.io; nothing to publish." ;;
              404) echo "$name $version is new; publishing."; new="$new $name" ;;
              *) echo "crates.io answered $status for $name $version"; exit 1 ;;
            esac
          done
          echo "new=$new" >> "$GITHUB_OUTPUT"
      - name: CHANGELOG.md has an entry for each new version
        if: steps.check.outputs.new != ''
        run: |
          # every release says why: no dated entry, no publish
          # ("## 0.1.0 (unreleased)" holds a version back until its entry has its date)
          for name in ${{ steps.check.outputs.new }}; do
            read -r version dir < <(cargo metadata --no-deps --format-version 1 | jq -r --arg n "$name" '.packages[] | select(.name == $n) | "\(.version) \(.manifest_path | rtrimstr("/Cargo.toml"))"')
            grep -sqE "^## ${version//./\\.} \([0-9]{4}-[0-9]{2}-[0-9]{2}\)" CHANGELOG.md "$dir/CHANGELOG.md" \
              || { echo "CHANGELOG.md has no '## $version (YYYY-MM-DD)' entry for $name; write it first"; exit 1; }
          done
      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.check.outputs.new != ''
        id: auth
      - name: Publish
        if: steps.check.outputs.new != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          # Cargo.lock may differ from the commit only because cargo refreshed it (or a sibling crate
          # cloned beside this one is at another version); anything else is a real change, and publishing stops.
          if [ -n "$(git status --porcelain --untracked-files=all -- . ':(exclude)Cargo.lock' ':(exclude)**/Cargo.lock')" ]; then
            git status --short; echo "uncommitted changes besides Cargo.lock"; exit 1
          fi
          # in dependency order; a crate published a moment ago may not be in the index yet, so wait for it and retry
          for name in ${{ steps.check.outputs.new }}; do
            for attempt in $(seq 1 30); do
              log="$RUNNER_TEMP/publish-$name.log"
              if cargo publish -p "$name" --allow-dirty 2> "$log"; then cat "$log"; continue 2; fi
              cat "$log"
              grep -qE 'no matching package named|candidate versions found which didn.t match' "$log" || exit 1
              echo "a dependency is not on crates.io yet; waiting 30s (attempt $attempt of 30)"
              sleep 30
            done
            exit 1
          done
